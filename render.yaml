services:
  - type: web
    name: beter-life-backend
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: verify-full
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: SUPABASE_URL
        sync: false
      - key: JWT_ALGORITHM
        value: ES256
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
