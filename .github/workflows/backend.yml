name: Backend quality gates
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: beter_life_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d beter_life_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_SSL: disable
      TEST_DATABASE_URL: postgresql://test:ci-only-disposable@127.0.0.1:5432/beter_life_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm compact lint
      - run: pnpm compact typecheck
      - run: pnpm compact test
      - name: Prepare Supabase Auth test fixtures
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Migrate empty PostgreSQL
        run: pnpm compact db:migrate
      - name: Grant disposable RLS integration privileges
        run: >-
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "GRANT USAGE ON SCHEMA app TO anon, authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA app TO anon, authenticated;"
      - name: PostgreSQL integration and migration idempotency
        run: pnpm compact test:integration
      - run: pnpm compact openapi:check
      - name: Finance client contract drift
        run: node .codex/scripts/compact-command.mjs -- node --import tsx scripts/finance-contract.ts --check
      - run: pnpm compact build
      - run: pnpm compact security:scan
      - run: node .codex/scripts/test-harness.mjs
      - name: Ensure clean contract and migration metadata
        run: git diff --exit-code && git diff --check
      - name: Failure diagnostics
        if: failure()
        run: tail -n 100 .harness/logs/*.log
